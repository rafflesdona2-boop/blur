<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APKcam</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; font-family:'Segoe UI', Arial, sans-serif;
  }
  #app {
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  #video {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:contain; transform:scaleX(-1); /* Mengubah cover ke contain agar tidak terlalu ngezoom */
    filter: blur(0px) brightness(1);
    transition: filter 0.4s ease;
  }
  #video.blurred {
    filter: blur(18px) brightness(0.55);
  }
  canvas#overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:4;
  }
  #logoLayer {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.4s ease;
    z-index:5;
  }
  #logoLayer.show { opacity:1; }
  #logoLayer img {
    width:38vmin; max-width:340px;
    filter: drop-shadow(0 0 25px rgba(255,215,0,0.55));
    animation: pop 0.5s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity:0; }
    60% { transform: scale(1.08); opacity:1; }
    100% { transform: scale(1); opacity:1; }
  }
  #brand {
    position:absolute; top:22px; left:50%; transform:translateX(-50%);
    color:#fff; font-weight:700; font-size:22px; letter-spacing:2px;
    text-shadow:0 2px 8px rgba(0,0,0,0.7);
    z-index:10; user-select:none;
  }
  #brand span { color:#FFD700; }
  #status {
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    color:#fff; background:rgba(0,0,0,0.45); padding:8px 18px;
    border-radius:20px; font-size:14px; z-index:10;
    backdrop-filter: blur(4px);
    display:flex; align-items:center; gap:8px;
    user-select:none;
  }
  #dot {
    width:9px; height:9px; border-radius:50%; background:#ff4b4b;
    transition: background 0.3s ease;
  }
  #dot.active { background:#3ddc84; box-shadow:0 0 8px #3ddc84; }
  #loading {
    position:absolute; inset:0; background:#000; color:#fff;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:50; font-size:15px;
    text-align:center; padding:20px;
  }
  .spinner {
    width:38px; height:38px; border:3px solid rgba(255,255,255,0.2);
    border-top-color:#FFD700; border-radius:50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #errBox {
    display:none; max-width:400px; color:#ffcccc; font-size:13px;
    line-height:1.5;
  }
</style>
</head>

    };
  })
  .catch(err => {
    console.error(err);
    errBox.textContent = "Gagal mengakses kamera. Pastikan izin kamera telah diberikan.";
    errBox.style.display = 'block';
    document.querySelector('.spinner').style.display = 'none';
  });

  // Logika efek blur dan partikel WOSM berjatuhan
  function startCameraEffects() {
    // Fase 1: Kamera Aktif Normal
    dot.classList.add('active');
    stateText.textContent = "Kamera Aktif";

    // Fase 2: Setelah 3 detik, layar blur & WOSM berjatuhan
    setTimeout(() => {
      video.classList.add('blurred');
      dot.classList.remove('active');
      stateText.textContent = "Memproses...";
      initParticles(); // Mulai efek wosm berjatuhan
      animateParticles();

      // Fase 3: Setelah 5 detik blur, blur hilang & WOSM lenyap, logo utama muncul
      setTimeout(() => {
        video.classList.remove('blurred');
        dot.classList.add('active');
        stateText.textContent = "Selesai";
        
        // Hentikan animasi & bersihkan canvas (WOSM hilang)
        cancelAnimationFrame(animationFrameId);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles = [];

        // Tampilkan logo utama
        logoLayer.classList.add('show');
      }, 5000);

    }, 3000);
  }

  // Objek Partikel WOSM (Menggunakan teks "WOSM" & Lambang Pramuka Fleur-de-lis)
  function initParticles() {
    const particleCount = 40;
    particles = [];
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        size: Math.random() * 14 + 12,
        speed: Math.random() * 3 + 2,
        opacity: Math.random() * 0.5 + 0.4,
        type: Math.random() > 0.5 ? '⚜️' : 'WOSM'
      });
    }
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    particles.forEach(p => {
      ctx.fillStyle = `rgba(255, 215, 0, ${p.opacity})`; // Warna Emas/Kuning Pramuka
      ctx.font = `bold ${p.size}px Arial`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = "rgba(255, 215, 0, 0.5)";
      
      ctx.fillText(p.type, p.x, p.y);
      
      p.y += p.speed;
      
      // Reset partikel ke atas jika sudah melewati layar bawah
      if (p.y > canvas.height) {
        p.y = Math.random() * -50;
        p.x = Math.random() * canvas.width;
      }
    });

    animationFrameId = requestAnimationFrame(animateParticles);
  }
</script>
