<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peace Sign Blur Cam</title>
<style>
  :root{
    --bg: #0B0E14;
    --panel: #12161f;
    --gold: #E8B54D;
    --teal: #4FD1C5;
    --rose: #E85D6B;
    --text: #F4F1EA;
    --muted: #8A93A6;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, #151a24 0%, #0B0E14 70%);
  }

  .cam-frame{
    position:relative;
    width:min(94vw, 620px);
    aspect-ratio: 3/4;
    border-radius:24px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(232,181,77,0.15), 0 30px 80px rgba(0,0,0,0.6);
    background:#000;
  }

  video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    transform: scaleX(-1);
    filter: blur(0px) brightness(1);
    transition: filter 0.6s ease;
  }

  video.is-blurred{
    filter: blur(22px) brightness(0.75) saturate(1.1);
  }

  canvas#fx{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }

  /* corner brackets, signature element */
  .bracket{
    position:absolute;
    width:34px; height:34px;
    border: 3px solid var(--teal);
    opacity:0.55;
    transition: opacity 0.4s ease, border-color 0.4s ease, transform 0.4s ease;
  }
  .bracket.tl{ top:14px; left:14px; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }
  .bracket.tr{ top:14px; right:14px; border-left:none; border-bottom:none; border-radius:0 8px 0 0; }
  .bracket.bl{ bottom:14px; left:14px; border-right:none; border-top:none; border-radius:0 0 0 8px; }
  .bracket.br{ bottom:14px; right:14px; border-left:none; border-top:none; border-radius:0 0 8px 0; }

  .cam-frame.active .bracket{
    border-color: var(--gold);
    opacity:1;
    transform: scale(1.06);
  }

  .hud{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    z-index:5;
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--muted);
    background: rgba(11,14,20,0.55);
    padding:8px 16px; border-radius:999px;
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .hud.active{ color:var(--gold); border-color: rgba(232,181,77,0.4); }

  .logo-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.6s ease;
    z-index:4;
  }
  .logo-overlay.show{ opacity:1; }

  .logo-row{
    display:flex; align-items:center; justify-content:center;
    gap:22px;
  }

  .logo-row img, .logo-row .logo-fallback{
    height:72px; width:72px;
    object-fit:contain;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5));
    transform: translateY(14px) scale(0.9);
    transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
  }
  .logo-overlay.show .logo-row img,
  .logo-overlay.show .logo-row .logo-fallback{
    transform: translateY(0) scale(1);
  }

  .logo-fallback{
    display:flex; align-items:center; justify-content:center;
    font-size:34px;
    background: rgba(244,241,234,0.06);
    border: 1px solid rgba(244,241,234,0.14);
    border-radius:18px;
  }

  .caption{
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--text);
    background: rgba(11,14,20,0.6);
    padding:6px 14px;
    border-radius:999px;
    border:1px solid rgba(232,181,77,0.35);
  }

  .status-bar{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    z-index:5;
    display:flex; align-items:center; gap:10px;
    font-size:12px; color: var(--muted);
    background: rgba(11,14,20,0.55);
    padding:8px 14px; border-radius:999px;
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
    text-align:center;
  }

  .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--muted);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .dot.on{ background: var(--rose); box-shadow:0 0 10px var(--rose); }

  .permission{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
    background: rgba(11,14,20,0.92);
  }
  .permission button{
    background: var(--gold); color:#1a1300; border:none;
    font-weight:700; letter-spacing:0.04em;
    padding:12px 26px; border-radius:999px; cursor:pointer;
    font-size:14px;
  }
  .permission p{ color: var(--muted); max-width:340px; font-size:13px; line-height:1.5; }
  .permission h2{ font-size:18px; margin:0; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="stage">
  <div class="cam-frame" id="camFrame">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="fx"></canvas>

    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>

    <div class="hud" id="hud">Acungkan 2 jari (peace sign) ke kamera</div>

    <div class="logo-overlay" id="logoOverlay">
      <div class="logo-row">
        <!-- Ganti src di bawah dengan file logo kamu sendiri.
             Jika gambar gagal dimuat, otomatis muncul placeholder emoji. -->
        <img src="logo1.png" alt="Logo 1" onerror="this.replaceWith(makeFallback('🌱'))">
        <img src="logo2.png" alt="Logo 2" onerror="this.replaceWith(makeFallback('⚜️'))">
        <img src="logo3.png" alt="Logo 3" onerror="this.replaceWith(makeFallback('❤️'))">
      </div>
      <div class="caption">Tunas Kelapa • WOSM • Cinta Pramuka</div>
    </div>

    <div class="status-bar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Menunggu kamera...</span>
    </div>

    <div class="permission" id="permBox">
      <h2>Izinkan Kamera</h2>
      <p>Website ini butuh akses kamera untuk mendeteksi tanda "dua jari" (peace sign). Semua proses berjalan di browser kamu, tidak ada video yang dikirim ke server manapun.</p>
      <button id="startBtn">Aktifkan Kamera</button>
    </div>
  </div>
</div>

<audio id="backsound" src="backsound.mp3" loop preload="auto"></audio>

<!-- MediaPipe Hands (deteksi tangan) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
/* =========================================================
   PEACE-SIGN BLUR CAM
   - Deteksi 2 jari (index + tengah) via MediaPipe Hands
   - Saat terdeteksi: blur kamera, tampilkan logo, mainkan backsound,
     tampilkan efek partikel jatuh (love, tunas kelapa, wosm)
   - Saat tidak terdeteksi lagi: semua efek dimatikan
   ========================================================= */

const video       = document.getElementById('video');
const camFrame    = document.getElementById('camFrame');
const hud         = document.getElementById('hud');
const logoOverlay = document.getElementById('logoOverlay');
const statusDot   = document.getElementById('statusDot');
const statusText  = document.getElementById('statusText');
const permBox     = document.getElementById('permBox');
const startBtn    = document.getElementById('startBtn');
const backsound   = document.getElementById('backsound');
const fxCanvas    = document.getElementById('fx');
const fxCtx       = fxCanvas.getContext('2d');

function makeFallback(emoji){
  const d = document.createElement('div');
  d.className = 'logo-fallback';
  d.textContent = emoji;
  return d;
}
window.makeFallback = makeFallback;

// ---------- Canvas sizing ----------
function resizeCanvas(){
  fxCanvas.width  = camFrame.clientWidth;
  fxCanvas.height = camFrame.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

// ---------- Particle system (efek jatuh) ----------
const ICONS = ['❤️', '🌱', '⚜️']; // love, tunas kelapa (placeholder), wosm (placeholder)
let particles = [];
let particleSpawnTimer = null;

function spawnParticle(){
  particles.push({
    x: Math.random() * fxCanvas.width,
    y: -30,
    size: 20 + Math.random() * 22,
    speed: 1 + Math.random() * 2.2,
    drift: (Math.random() - 0.5) * 1.4,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.05,
    icon: ICONS[Math.floor(Math.random() * ICONS.length)],
    opacity: 0.75 + Math.random() * 0.25
  });
}

function startParticles(){
  if (particleSpawnTimer) return;
  particleSpawnTimer = setInterval(spawnParticle, 180);
}

function stopParticles(){
  clearInterval(particleSpawnTimer);
  particleSpawnTimer = null;
  // biarkan partikel yang sudah ada turun habis, tidak dihapus paksa
}

function animateParticles(){
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  particles.forEach(p => {
    p.y += p.speed;
    p.x += p.drift;
    p.rot += p.rotSpeed;
    fxCtx.save();
    fxCtx.globalAlpha = p.opacity;
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.font = `${p.size}px sans-serif`;
    fxCtx.textAlign = 'center';
    fxCtx.textBaseline = 'middle';
    fxCtx.fillText(p.icon, 0, 0);
    fxCtx.restore();
  });
  particles = particles.filter(p => p.y < fxCanvas.height + 40);
  requestAnimationFrame(animateParticles);
}

// ---------- Fallback backsound (jika backsound.mp3 tidak ada) ----------
let audioCtx = null;
let fallbackOsc = null;
let fallbackGain = null;
let usingFallbackSound = false;

function playFallbackTone(){
  if (usingFallbackSound) return;
  usingFallbackSound = true;
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  fallbackOsc = audioCtx.createOscillator();
  fallbackGain = audioCtx.createGain();
  fallbackOsc.type = 'sine';
  fallbackOsc.frequency.value = 392; // nada lembut
  fallbackGain.gain.value = 0.0001;
  fallbackOsc.connect(fallbackGain).connect(audioCtx.destination);
  fallbackOsc.start();
  fallbackGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.4);
}

function stopFallbackTone(){
  if (!usingFallbackSound) return;
  usingFallbackSound = false;
  if (fallbackGain){
    fallbackGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
  }
  setTimeout(() => {
    try{ fallbackOsc && fallbackOsc.stop(); }catch(e){}
  }, 350);
}

function startBacksound(){
  backsound.currentTime = 0;
  const playPromise = backsound.play();
  if (playPromise){
    playPromise.catch(() => {
      // backsound.mp3 tidak ditemukan / gagal -> pakai nada fallback
      playFallbackTone();
    });
  }
}

function stopBacksound(){
  backsound.pause();
  backsound.currentTime = 0;
  stopFallbackTone();
}

// ---------- Blur / Logo state ----------
let isBlurred = false;

function activateBlurEffect(){
  if (isBlurred) return;
  isBlurred = true;
  video.classList.add('is-blurred');
  camFrame.classList.add('active');
  hud.classList.add('active');
  hud.textContent = 'Terdeteksi! ✌️';
  logoOverlay.classList.add('show');
  statusText.textContent = 'Peace sign terdeteksi';
  statusDot.classList.add('on');
  startBacksound();
  startParticles();
}

function deactivateBlurEffect(){
  if (!isBlurred) return;
  isBlurred = false;
  video.classList.remove('is-blurred');
  camFrame.classList.remove('active');
  hud.classList.remove('active');
  hud.textContent = 'Acungkan 2 jari (peace sign) ke kamera';
  logoOverlay.classList.remove('show');
  statusText.textContent = 'Menunggu tanda dua jari...';
  statusDot.classList.remove('on');
  stopBacksound();
  stopParticles();
}

// ---------- Deteksi peace sign dari landmark tangan ----------
// index landmark MediaPipe: 0=wrist, 4=thumb tip, 8=index tip, 6=index pip,
// 12=middle tip, 10=middle pip, 16=ring tip, 14=ring pip, 20=pinky tip, 18=pinky pip
function dist(a, b){
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function isPeaceSign(landmarks){
  const wrist = landmarks[0];

  const fingerExtended = (tipIdx, pipIdx) =>
    dist(wrist, landmarks[tipIdx]) > dist(wrist, landmarks[pipIdx]) * 1.15;

  const fingerCurled = (tipIdx, pipIdx) =>
    dist(wrist, landmarks[tipIdx]) < dist(wrist, landmarks[pipIdx]) * 1.0;

  const indexUp  = fingerExtended(8, 6);
  const middleUp = fingerExtended(12, 10);
  const ringDown  = fingerCurled(16, 14);
  const pinkyDown = fingerCurled(20, 18);

  return indexUp && middleUp && ringDown && pinkyDown;
}

// ---------- Debounce agar tidak flicker ----------
let matchStreak = 0;
let missStreak = 0;
const ON_THRESHOLD  = 5;  // frame berturut-turut untuk menyalakan efek
const OFF_THRESHOLD = 8;  // frame berturut-turut untuk mematikan efek

function handleDetectionFrame(detected){
  if (detected){
    matchStreak++;
    missStreak = 0;
    if (matchStreak >= ON_THRESHOLD) activateBlurEffect();
  } else {
    missStreak++;
    matchStreak = 0;
    if (missStreak >= OFF_THRESHOLD) deactivateBlurEffect();
  }
}

// ---------- Setup MediaPipe Hands ----------
let handsModel = null;
let mpCamera = null;

function onHandsResults(results){
  const hasPeace = !!(results.multiHandLandmarks && results.multiHandLandmarks.length > 0 &&
    results.multiHandLandmarks.some(isPeaceSign));
  handleDetectionFrame(hasPeace);
}

async function initHandsAndCamera(){
  handsModel = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  handsModel.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });
  handsModel.onResults(onHandsResults);

  mpCamera = new Camera(video, {
    onFrame: async () => { await handsModel.send({ image: video }); },
    width: 640,
    height: 480
  });
  await mpCamera.start();
}

// ---------- Start flow ----------
startBtn.addEventListener('click', async () => {
  try{
    statusText.textContent = 'Meminta izin kamera...';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();

    permBox.classList.add('hidden');
    resizeCanvas();
    animateParticles();

    statusText.textContent = 'Memuat model deteksi tangan...';
    await initHandsAndCamera();
    statusText.textContent = 'Menunggu tanda dua jari...';
  }catch(err){
    console.error(err);
    statusText.textContent = 'Gagal mengakses kamera: ' + err.message;
  }
});

resizeCanvas();
</script>
</body>
</html>
