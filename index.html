<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APKcam</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; font-family:'Segoe UI', Arial, sans-serif;
  }
  #app {
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  #video {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover; transform:scaleX(-1);
    filter: blur(0px) brightness(1);
    transition: filter 0.4s ease;
  }
  #video.blurred {
    filter: blur(18px) brightness(0.55);
  }
  canvas#overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; display:none;
  }
  #logoLayer {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.4s ease;
    z-index:5;
  }
  #logoLayer.show { opacity:1; }
  #logoLayer img {
    width:38vmin; max-width:340px;
    filter: drop-shadow(0 0 25px rgba(255,215,0,0.55));
    animation: pop 0.5s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity:0; }
    60% { transform: scale(1.08); opacity:1; }
    100% { transform: scale(1); opacity:1; }
  }
  #brand {
    position:absolute; top:22px; left:50%; transform:translateX(-50%);
    color:#fff; font-weight:700; font-size:22px; letter-spacing:2px;
    text-shadow:0 2px 8px rgba(0,0,0,0.7);
    z-index:10; user-select:none;
  }
  #brand span { color:#FFD700; }
  #status {
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    color:#fff; background:rgba(0,0,0,0.45); padding:8px 18px;
    border-radius:20px; font-size:14px; z-index:10;
    backdrop-filter: blur(4px);
    display:flex; align-items:center; gap:8px;
    user-select:none;
  }
  #dot {
    width:9px; height:9px; border-radius:50%; background:#ff4b4b;
    transition: background 0.3s ease;
  }
  #dot.active { background:#3ddc84; box-shadow:0 0 8px #3ddc84; }
  #loading {
    position:absolute; inset:0; background:#000; color:#fff;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:50; font-size:15px;
    text-align:center; padding:20px;
  }
  .spinner {
    width:38px; height:38px; border:3px solid rgba(255,255,255,0.2);
    border-top-color:#FFD700; border-radius:50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #errBox {
    display:none; max-width:400px; color:#ffcccc; font-size:13px;
    line-height:1.5;
  }
</style>
</head>

  <div id="brand">APK<span>cam</span></div>
  <div id="status"><div id="dot"></div><span id="statusText">Menyiapkan kamera...</span></div>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Memuat model deteksi tangan...</div>
    <div id="errBox"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
(function(){
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const ctx = overlay.getContext('2d');
  const logoLayer = document.getElementById('logoLayer');
  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loadingText');
  const errBox = document.getElementById('errBox');
  const statusText = document.getElementById('statusText');
  const dot = document.getElementById('dot');

  let blurActive = false;
  let stableCount = 0;
  let lastRawTwo = false;
  const STABLE_FRAMES = 4; // reduce flicker

  function setBlur(active){
    if(active === blurActive) return;
    blurActive = active;
    video.classList.toggle('blurred', active);
    logoLayer.classList.toggle('show', active);
    dot.classList.toggle('active', active);
    statusText.textContent = active ? 'Terdeteksi 2 jari — logo aktif' : 'Menunggu isyarat 2 jari...';
  }

  function countExtendedFingers(landmarks, handedness){
    // landmarks: 21 points, each {x,y,z} normalized (mirrored because we flip video via CSS,
    // but MediaPipe works on the raw, unflipped frame)
    let count = 0;
    const tips = [8, 12, 16, 20];
    const pips = [6, 10, 14, 18];
    for(let i=0;i<4;i++){
      if(landmarks[tips[i]].y < landmarks[pips[i]].y - 0.02){
        count++;
      }
    }
    // Thumb: compare x of tip(4) vs ip(3) relative to hand orientation
    const thumbTip = landmarks[4];
    const thumbIp = landmarks[3];
    const wrist = landmarks[0];
    const isRightHand = handedness === 'Right';
    if(isRightHand){
      if(thumbTip.x < thumbIp.x - 0.02) count++;
    } else {
      if(thumbTip.x > thumbIp.x + 0.02) count++;
    }
    return count;
  }

  function onResults(results){
    let showTwo = false;
    if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0){
      for(let h=0; h<results.multiHandLandmarks.length; h++){
        const lm = results.multiHandLandmarks[h];
        const handednessLabel = results.multiHandedness && results.multiHandedness[h]
          ? results.multiHandedness[h].label : 'Right';
        const c = countExtendedFingers(lm, handednessLabel);
        if(c === 2){ showTwo = true; break; }
      }
    }

    // debounce / smoothing to avoid flicker
    if(showTwo === lastRawTwo){
      stableCount++;
    } else {
      stableCount = 0;
      lastRawTwo = showTwo;
    }
    if(stableCount >= STABLE_FRAMES){
      setBlur(showTwo);
    }
  }

  async function start(){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width:{ideal:960}, height:{ideal:720} },
        audio:false
      });
      video.srcObject = stream;
      await new Promise(res => { video.onloadedmetadata = () => res(); });
      video.play();

      overlay.width = video.videoWidth || 960;
      overlay.height = video.videoHeight || 720;

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.6
      });
      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => { await hands.send({image: video}); },
        width: 960,
        height: 720
      });
      camera.start();

      loading.style.display = 'none';
      statusText.textContent = 'Menunggu isyarat 2 jari...';
    } catch(err){
      loadingText.textContent = 'Tidak dapat mengakses kamera atau memuat model.';
      errBox.style.display = 'block';
      errBox.textContent = 'Detail: ' + (err && err.message ? err.message : err) +
        '. Pastikan izin kamera diaktifkan dan koneksi internet aktif (untuk memuat model deteksi tangan), lalu muat ulang halaman.';
    }
  }

  window.addEventListener('load', start);
})();
</script>
